# LongCodeU subset (0~8K bucket) with the FULL KV cache.
# First build the subset on the instance:  python datasets/prepare_longcodeu.py
# Then:                                    python main.py run --config configs/experiment_longcodeu.yaml
experiment:
  experiment_id: longcodeu_8k_full
  workflow: all
  cache_method: full
  context_length: 8192
  max_new_tokens: 512        # answers are whole functions / docs; 256 would cut many off
  batch_size: 1
  temperature: 0.0
  do_sample: false
  repetition_penalty: 1.0
  seed: 0
  overflow_policy: skip      # official prompts are never truncated
  measure_prefill: true
  warmup: true
context_fill:
  enabled: false
  target_tokens: 0
  depth: 0.5
  seed: 1234
dataset:
  path: datasets/processed/longcodeu_8k.json
  split: all
  max_samples: null
evaluation:
  exec_timeout_seconds: 10
output:
  results_directory: results
  save_responses: true
s3:
  bucket: ""
  prefix: kv_cache_research

# Same baseline, but every prompt is padded to ~8K tokens with unrelated code and
# the real task placed in the middle. Full KV cache, no compression.
# Run after the basic baseline works:  python main.py run --config configs/experiment_longctx.yaml
experiment:
  experiment_id: baseline_longctx_8k_d50
  workflow: all
  cache_method: full
  context_length: 8192
  max_new_tokens: 256
  batch_size: 1
  temperature: 0.0
  do_sample: false
  repetition_penalty: 1.0
  seed: 0
  overflow_policy: skip
  measure_prefill: true
  warmup: true
context_fill:
  enabled: true
  target_tokens: 7680        # leaves room for 256 new tokens + chat template
  depth: 0.5
  seed: 1234
dataset:
  path: datasets/sample_tasks.json
  split: all
  max_samples: 30
evaluation:
  exec_timeout_seconds: 10
output:
  results_directory: results
  save_responses: true
s3:
  bucket: ""
  prefix: kv_cache_research
